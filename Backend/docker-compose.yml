services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: skillify
    ports:
      - '5432:5432'
    volumes:
      - skillify_pg:/var/lib/postgresql/data

  api:
    build: .
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api
      DATABASE_URL: postgresql://postgres:postgres@db:5432/skillify?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-dev-access-secret-must-be-32-chars-min!!}
      JWT_ACCESS_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
    depends_on:
      - db

volumes:
  skillify_pg:
